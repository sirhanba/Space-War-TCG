<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TCG Espacial</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --accent: #66fcf1;
            --accent-dim: #45a29e;
            --text-color: #c5c6c7;
            --enemy-color: #fc6666;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Tela de Game Over */
        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 12, 16, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #game-over-screen h1 {
            color: var(--accent);
            margin-bottom: 20px;
            font-size: 2.5em;
            text-transform: uppercase;
        }
        #game-over-screen.derrota h1 { color: var(--enemy-color); }
        #game-over-screen button {
            font-size: 1.2em;
            padding: 15px 30px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: #000;
            font-weight: bold;
            border-bottom: 1px solid var(--accent-dim);
        }
        .status-bar.enemy { border-bottom: none; border-top: 1px solid var(--enemy-color); color: var(--enemy-color); }

        .board {
            display: flex;
            justify-content: space-around;
            padding: 10px 5px;
            flex: 1;
        }
        .board.enemy { background: rgba(252, 102, 102, 0.05); }

        .rota {
            width: 30%;
            border: 2px dashed var(--accent-dim);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.2s ease;
        }
        .board.enemy .rota { border-color: rgba(252, 102, 102, 0.4); }
        .rota.highlight { background-color: rgba(102, 252, 241, 0.1); border-color: var(--accent); }
        .rota-label { position: absolute; opacity: 0.3; font-size: 0.8em; z-index: 0; }

        .carta {
            width: 75px;
            height: 105px;
            background: var(--panel-bg);
            border: 1px solid var(--accent);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            z-index: 10;
            touch-action: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .carta.enemy { border-color: var(--enemy-color); }
        .carta.dragging {
            position: absolute;
            opacity: 0.9;
            transform: scale(1.1) rotate(2deg);
            box-shadow: 0 0 15px var(--accent);
            z-index: 100;
        }
        .carta.disabled { opacity: 0.5; border-color: #555; }

        .carta-custo {
            background: var(--accent);
            color: #000;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8em;
            align-self: flex-start;
        }
        .carta.enemy .carta-custo { background: var(--enemy-color); }
        .carta-nome { font-size: 0.6em; text-align: center; margin-top: 5px; flex-grow: 1; word-wrap: break-word; }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.7em;
            font-weight: bold;
        }

        .mao {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            padding: 10px 5px;
            background: rgba(31, 40, 51, 0.8);
            min-height: 125px;
        }

        .controles {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #000;
            border-top: 1px solid var(--accent-dim);
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: bold;
            font-family: inherit;
        }
        button:active { transform: scale(0.95); }
        
        .deck-info {
            font-size: 0.8em;
            color: var(--accent-dim);
            position: absolute;
            bottom: 60px;
            left: 10px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Overlay de Game Over -->
    <div id="game-over-screen">
        <h1 id="game-over-title">Vitória!</h1>
        <button onclick="reiniciarJogo()">Jogar Novamente</button>
    </div>

    <div class="status-bar enemy">
        <span>Inimigo (HP: <span id="hp-inimigo">20</span>)</span>
    </div>

    <div class="board enemy" id="enemy-board">
        <div class="rota" data-rota="alpha"><span class="rota-label">ALPHA</span></div>
        <div class="rota" data-rota="nebula"><span class="rota-label">NEBULA</span></div>
        <div class="rota" data-rota="omega"><span class="rota-label">ÔMEGA</span></div>
    </div>

    <div class="board" id="player-board">
        <div class="rota" data-rota="alpha"><span class="rota-label">ALPHA</span></div>
        <div class="rota" data-rota="nebula"><span class="rota-label">NEBULA</span></div>
        <div class="rota" data-rota="omega"><span class="rota-label">ÔMEGA</span></div>
    </div>

    <div class="deck-info">Deck: <span id="deck-count">0</span></div>

    <div class="mao" id="mao-jogador"></div>

    <div class="status-bar">
        <span>Você (HP: <span id="hp-jogador">20</span>)</span>
    </div>
    <div class="controles">
        <span>Turno: <span id="turno-ui">1</span> | Energia: <span id="energia-ui">1/1</span></span>
        <button onclick="finalizarTurno()">Fim de Turno</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let turno, energiaMax, energiaAtual, hpJogador, hpInimigo;
        let cartaArrastada = null;
        let posInicial = { x: 0, y: 0, parent: null, nextSibling: null };
        let offset = { x: 0, y: 0 };
        let baralho = [];

        const rotas = document.querySelectorAll('.rota');
        const maoJogador = document.getElementById('mao-jogador');
        const gameOverScreen = document.getElementById('game-over-screen');
        const gameOverTitle = document.getElementById('game-over-title');

        const baseDeck = [
            { custo: 1, ataque: 1, vida: 2, nome: "Caça Leve" },
            { custo: 1, ataque: 2, vida: 1, nome: "Interceptor" },
            { custo: 2, ataque: 3, vida: 1, nome: "Bombardeiro" },
            { custo: 2, ataque: 1, vida: 3, nome: "Sonda" },
            { custo: 3, ataque: 2, vida: 5, nome: "Nave Escudo" },
            { custo: 4, ataque: 5, vida: 4, nome: "Cruzador" }
        ];

        function atualizarHUD() {
            document.getElementById('energia-ui').innerText = `${energiaAtual}/${energiaMax}`;
            document.getElementById('turno-ui').innerText = turno;
            document.getElementById('hp-jogador').innerText = hpJogador;
            document.getElementById('hp-inimigo').innerText = hpInimigo;
            document.getElementById('deck-count').innerText = baralho.length;

            document.querySelectorAll('#mao-jogador .carta').forEach(carta => {
                const custo = parseInt(carta.dataset.custo);
                if (custo > energiaAtual) carta.classList.add('disabled');
                else carta.classList.remove('disabled');
            });
        }

        function animarDano(elemento) {
            elemento.style.transform = 'translateY(10px) rotate(-5deg)';
            elemento.style.borderColor = 'red';
            setTimeout(() => {
                elemento.style.transform = '';
                elemento.style.borderColor = '';
            }, 300);
        }

        function sacarCarta() {
            if (baralho.length === 0) return;
            if (document.querySelectorAll('#mao-jogador .carta').length >= 5) return;

            const dadosCarta = baralho.pop();
            const novaCarta = document.createElement('div');
            novaCarta.className = 'carta';
            novaCarta.dataset.custo = dadosCarta.custo;
            novaCarta.dataset.ataque = dadosCarta.ataque;
            novaCarta.dataset.vida = dadosCarta.vida;
            
            novaCarta.innerHTML = `
                <div class="carta-custo">${dadosCarta.custo}</div>
                <div class="carta-nome">${dadosCarta.nome}</div>
                <div class="stats"><span>⚔️${dadosCarta.ataque}</span><span>🛡️${dadosCarta.vida}</span></div>
            `;
            
            adicionarEventosArrastar(novaCarta);
            maoJogador.appendChild(novaCarta);
        }

        function criarInimigoTeste() {
            const rotaAlfa = document.querySelector('#enemy-board .rota[data-rota="alpha"]');
            rotaAlfa.innerHTML = `<span class="rota-label">ALPHA</span>
                <div class="carta enemy" data-ataque="2" data-vida="3">
                    <div class="carta-custo">1</div>
                    <div class="carta-nome">Drone Corsário</div>
                    <div class="stats"><span>⚔️2</span><span>🛡️3</span></div>
                </div>`;
        }

        window.reiniciarJogo = function() {
            turno = 1;
            energiaMax = 1;
            energiaAtual = 1;
            hpJogador = 20;
            hpInimigo = 20;

            // Limpa o tabuleiro
            document.querySelectorAll('.rota').forEach(rota => {
                const label = rota.querySelector('.rota-label').outerHTML;
                rota.innerHTML = label; 
            });
            maoJogador.innerHTML = '';
            gameOverScreen.style.display = 'none';
            gameOverScreen.classList.remove('derrota');

            criarInimigoTeste();

            // Embaralha o deck clonado
            baralho = [...baseDeck, ...baseDeck].sort(() => Math.random() - 0.5); // Duplicamos as cartas base para ter 12 no deck

            sacarCarta();
            sacarCarta();
            sacarCarta();
            
            atualizarHUD();
        };

        function finalizarJogo(resultado) {
            gameOverScreen.style.display = 'flex';
            if (resultado === 'derrota') {
                gameOverTitle.innerText = "Base Destruída";
                gameOverScreen.classList.add('derrota');
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            } else {
                gameOverTitle.innerText = "Setor Dominado";
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }
        }

        window.finalizarTurno = function() {
            const rotasNomes = ['alpha', 'nebula', 'omega'];
            
            rotasNomes.forEach(nome => {
                const slotJogador = document.querySelector(`#player-board .rota[data-rota="${nome}"]`);
                const slotInimigo = document.querySelector(`#enemy-board .rota[data-rota="${nome}"]`);
                
                const cartaJog = slotJogador.querySelector('.carta');
                const cartaIni = slotInimigo.querySelector('.carta');

                if (cartaJog && cartaIni) {
                    let hpJog = parseInt(cartaJog.dataset.vida) - parseInt(cartaIni.dataset.ataque);
                    let hpIni = parseInt(cartaIni.dataset.vida) - parseInt(cartaJog.dataset.ataque);
                    
                    animarDano(cartaJog);
                    animarDano(cartaIni);

                    cartaJog.dataset.vida = hpJog;
                    cartaIni.dataset.vida = hpIni;
                    cartaJog.querySelector('.stats').innerHTML = `<span>⚔${cartaJog.dataset.ataque}</span><span>🛡️${hpJog}</span>`;
                    cartaIni.querySelector('.stats').innerHTML = `<span>⚔️${cartaIni.dataset.ataque}</span><span>🛡️${hpIni}</span>`;

                    if(hpJog <= 0) setTimeout(() => cartaJog.remove(), 400);
                    if(hpIni <= 0) setTimeout(() => cartaIni.remove(), 400);

                } else if (cartaJog && !cartaIni) {
                    hpInimigo -= parseInt(cartaJog.dataset.ataque);
                    animarDano(slotInimigo);
                } else if (!cartaJog && cartaIni) {
                    hpJogador -= parseInt(cartaIni.dataset.ataque);
                    animarDano(slotJogador);
                }
            });

            if (hpJogador <= 0) {
                setTimeout(() => finalizarJogo('derrota'), 500);
                return;
            }
            if (hpInimigo <= 0) {
                setTimeout(() => finalizarJogo('vitoria'), 500);
                return;
            }

            turno++;
            energiaMax = Math.min(turno, 6);
            energiaAtual = energiaMax;
            
            sacarCarta();
            atualizarHUD();
            
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        };

        function adicionarEventosArrastar(carta) {
            carta.addEventListener('pointerdown', (e) => {
                if (carta.classList.contains('disabled')) return;
                
                cartaArrastada = carta;
                const rect = carta.getBoundingClientRect();
                offset.x = e.clientX - rect.left;
                offset.y = e.clientY - rect.top;
                
                posInicial.parent = carta.parentElement;
                posInicial.nextSibling = carta.nextSibling;

                carta.classList.add('dragging');
                document.body.appendChild(carta);
                
                carta.style.left = `${e.clientX - offset.x}px`;
                carta.style.top = `${e.clientY - offset.y}px`;

                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            });
        }

        document.addEventListener('pointermove', (e) => {
            if (!cartaArrastada) return;
            e.preventDefault();
            
            cartaArrastada.style.left = `${e.clientX - offset.x}px`;
            cartaArrastada.style.top = `${e.clientY - offset.y}px`;

            rotas.forEach(rota => {
                const rect = rota.getBoundingClientRect();
                if (e.clientX > rect.left && e.clientX < rect.right && e.clientY > rect.top && e.clientY < rect.bottom && rota.closest('#player-board')) {
                    rota.classList.add('highlight');
                } else {
                    rota.classList.remove('highlight');
                }
            });
        });

        document.addEventListener('pointerup', (e) => {
            if (!cartaArrastada) return;

            let soltouNaRota = false;
            
            document.querySelectorAll('#player-board .rota').forEach(rota => {
                rota.classList.remove('highlight');
                const rect = rota.getBoundingClientRect();
                
                if (e.clientX > rect.left && e.clientX < rect.right && e.clientY > rect.top && e.clientY < rect.bottom) {
                    if (!rota.querySelector('.carta')) {
                        const custo = parseInt(cartaArrastada.dataset.custo);
                        energiaAtual -= custo;
                        
                        cartaArrastada.style.position = 'relative';
                        cartaArrastada.style.left = '0';
                        cartaArrastada.style.top = '0';
                        cartaArrastada.classList.remove('dragging');
                        rota.appendChild(cartaArrastada);
                        
                        soltouNaRota = true;
                        atualizarHUD();
                        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
                    }
                }
            });

            if (!soltouNaRota) {
                cartaArrastada.style.position = 'relative';
                cartaArrastada.style.left = '0';
                cartaArrastada.style.top = '0';
                cartaArrastada.classList.remove('dragging');
                if(posInicial.parent) {
                    posInicial.parent.insertBefore(cartaArrastada, posInicial.nextSibling);
                }
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }

            cartaArrastada = null;
        });

        // Inicializa o jogo ao carregar
        reiniciarJogo();
    </script>
</body>
</html>
