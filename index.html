<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCG Espacial</title>
    <!-- SDK do Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* CSS: Estilos e Tema Espacial */
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --neon-blue: #66fcf1;
            --neon-dark: #45a29e;
            --text-light: #c5c6c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Evita selecionar texto no celular */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Impede rolagem da tela */
        }

        /* Cabeçalho de Informações */
        header {
            padding: 10px;
            text-align: center;
            background: linear-gradient(to bottom, #111, transparent);
            border-bottom: 1px solid var(--neon-dark);
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            color: var(--neon-blue);
        }

        /* Área do Tabuleiro (3 Setores) */
        #board {
            flex-grow: 1;
            display: flex;
            padding: 10px;
            gap: 10px;
            justify-content: space-between;
        }

        .sector {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px dashed var(--neon-dark);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            position: relative;
        }

        .sector-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(102, 252, 241, 0.7);
        }

        /* Mão do Jogador */
        #player-hand {
            height: 140px;
            background-color: #050508;
            border-top: 2px solid var(--neon-blue);
            display: flex;
            align-items: center;
            padding: 10px;
            gap: 10px;
            overflow-x: auto; /* Permite rolar as cartas na mão se houver muitas */
        }

        /* Estilo da Carta */
        .card {
            min-width: 80px;
            height: 110px;
            background: linear-gradient(135deg, #2a2a35, #14141d);
            border: 1px solid var(--neon-dark);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.95);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
        }

        .card-cost {
            color: #f1c40f; /* Energia amarela */
        }

        .card-name {
            font-size: 10px;
            text-align: center;
            margin-top: 10px;
            color: white;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
        }

        .stat-atk { color: #e74c3c; } /* Ataque vermelho */
        .stat-def { color: #3498db; } /* Defesa azul */

    </style>
</head>
<body>

    <!-- HUD (Heads Up Display) -->
    <header>
        <div id="player-info">Comandante 🧑‍🚀</div>
        <div id="turn-info">Turno 1/6</div>
        <div id="energy-info">⚡ 1/1</div>
    </header>

    <!-- Campo de Batalha -->
    <div id="board">
        <div class="sector" id="sector-1">
            <div class="sector-title">Alpha</div>
        </div>
        <div class="sector" id="sector-2">
            <div class="sector-title">Nebula</div>
        </div>
        <div class="sector" id="sector-3">
            <div class="sector-title">Ômega</div>
        </div>
    </div>

    <!-- Mão do Jogador -->
    <div id="player-hand">
        <!-- As cartas serão injetadas aqui pelo JavaScript -->
    </div>

    <!-- JavaScript: Lógica do Jogo -->
    <script>
        // Inicia a integração com o Telegram
        const tg = window.Telegram.WebApp;
        tg.expand(); // Faz o app ocupar a tela inteira do celular

        // Pega o nome do usuário do Telegram (se existir)
        const playerName = tg.initDataUnsafe?.user?.first_name || "Comandante";
        document.getElementById('player-info').innerText = `${playerName} 🧑‍🚀`;

        // Banco de dados temporário de cartas (apenas para teste)
        const deckInicial = [
            { id: 1, name: "Caça Estelar", cost: 1, atk: 2, def: 1 },
            { id: 2, name: "Escudo Drone", cost: 1, atk: 0, def: 4 },
            { id: 3, name: "Cruzador", cost: 2, atk: 3, def: 3 },
            { id: 4, name: "Raio Laser", cost: 3, atk: 5, def: 1 }
        ];

        // Função para criar o elemento visual da carta
        function renderCard(cardData) {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            
            // Monta o HTML interno da carta
            cardEl.innerHTML = `
                <div class="card-header">
                    <span></span>
                    <span class="card-cost">${cardData.cost}⚡</span>
                </div>
                <div class="card-name">${cardData.name}</div>
                <div class="card-stats">
                    <span class="stat-atk">⚔️${cardData.atk}</span>
                    <span class="stat-def">🛡️${cardData.def}</span>
                </div>
            `;

            // Adiciona uma ação de clique simples por enquanto
            cardEl.onclick = () => {
                alert(`Você selecionou a carta: ${cardData.name}`);
                // tg.HapticFeedback.impactOccurred('light'); // Vibração suave (opcional no Telegram)
            };

            return cardEl;
        }

        // Função para preencher a mão do jogador
        function drawHand() {
            const handContainer = document.getElementById('player-hand');
            deckInicial.forEach(card => {
                const cardElement = renderCard(card);
                handContainer.appendChild(cardElement);
            });
        }

        // Inicia o jogo
        drawHand();
        tg.ready(); // Avisa o Telegram que está tudo carregado
    </script>
</body>
</html>
